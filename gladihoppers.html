<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>M0TIV3 — Gladihoppers</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e5e5e5;
      color: #111;
      font-family: Arial, sans-serif;
    }

    header {
      background: white;
      border-bottom: 5px solid #111;
      padding: 20px;
    }

    .logo {
      font-family: Impact, Arial Black, sans-serif;
      font-size: 70px;
      letter-spacing: -4px;
      text-shadow: 4px 4px #aaa;
      transform: rotate(-2deg);
      display: inline-block;
    }

    .back {
      display: inline-block;
      margin-left: 25px;
      padding: 12px 18px;
      background: #111;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border: 3px solid #111;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 18px 50px;
    }

    h1 {
      font-family: Impact, Arial Black, sans-serif;
      font-size: 55px;
      margin: 20px 0;
    }

    .game-box {
      background: #111;
      border: 5px solid #111;
      box-shadow: 10px 10px 0 #777;
      width: 100%;
    }

    iframe {
      display: block;
      width: 100%;
      height: 650px;
      border: 0;
    }

    .note {
      background: white;
      border: 4px solid #111;
      padding: 15px;
      margin-top: 25px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 50px;
      }

      .back {
        margin-left: 0;
        margin-top: 15px;
      }

      iframe {
        height: 500px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">M0TIV3</div>

    <a class="back" href="index.html">
      ← BACK
    </a>
  </header>

  <main>

    <h1>GLADIHOPPERS</h1>

    <div class="game-box">

      <iframe
        src="https://www.miniplay.com/embed/gladihoppers"
        allowfullscreen>
      </iframe>

    </div>

    <div class="note">
      GLADIHOPPERS — PLAY NOW
    </div>

  </main>

</body>
</html>
